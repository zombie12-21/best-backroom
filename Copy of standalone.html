// vfs:maze.js
function genMaze(n, seed) {
  let s = seed >>> 0;
  const rnd = () => {
    s = s * 1664525 + 1013904223 >>> 0;
    return s / 4294967296;
  };
  let g = Array.from({ length: n }, () => Array(n).fill(1));
  function carve(x, y) {
    g[y][x] = 0;
    let d = [[2, 0], [-2, 0], [0, 2], [0, -2]].sort(() => rnd() - 0.5);
    for (let [dx, dy] of d) {
      let nx = x + dx, ny = y + dy;
      if (nx > 0 && ny > 0 && nx < n - 1 && ny < n - 1 && g[ny][nx] === 1) {
        g[y + dy / 2][x + dx / 2] = 0;
        carve(nx, ny);
      }
    }
  }
  carve(1, 1);

  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.font = "20px serif";
  items.forEach((it) => {
    let D = ITEMS[it.id];
    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.beginPath();
    ctx.ellipse(it.x - cx, it.y - cy + 8, 10, 4, 0, 0, 7);
    ctx.fill();
    ctx.fillText(D.icon, it.x - cx, it.y - cy + 7 + Math.sin(Date.now() / 400 + it.x) * 2);
  });
  traders.forEach((t) => {
    ctx.font = "26px serif";
    ctx.fillText("\u{1F9D1}\u200D\u{1F4BC}", t.x - cx, t.y - cy + 8);
    ctx.font = "11px monospace";
    ctx.fillStyle = "#ffe9a3";
    let s2 = t.stock[0];
    ctx.fillText(s2 ? `[E] ${t.name}: ${ITEMS[s2.id].icon}${s2.price}\u{1FA99}` : `${t.name}: sold out`, t.x - cx, t.y - cy - 20);
  });
  ctx.font = "11px monospace";
  ctx.fillStyle = "#fff";
  items.forEach((it) => {
    if (Math.hypot(it.x - px, it.y - py) < 120) ctx.fillText(ITEMS[it.id].name, it.x - cx, it.y - cy - 14);
  });
  ents.forEach((e) => {
    let D = ENTITIES[e.t];
    let r = e.big ? 26 : 16;
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.beginPath();
    ctx.ellipse(e.x - cx, e.y - cy + r * 0.7, r * 0.9, r * 0.35, 0, 0, 7);
    ctx.fill();
    if (e.stun > 0) {
      ctx.fillStyle = "#9df";
      ctx.font = "14px serif";
      ctx.fillText("\u2736", e.x - cx + 14, e.y - cy - 14 + Math.sin(Date.now() / 150) * 3);
    }
    ctx.fillStyle = "#" + D.color.toString(16).padStart(6, "0");
    ctx.beginPath();
    ctx.arc(e.x - cx, e.y - cy, r, 0, 7);
    ctx.fill();
    ctx.font = e.big ? "34px serif" : "24px serif";
    ctx.fillText(D.icon, e.x - cx, e.y - cy + 8);
    if (chasing && Math.hypot(e.x - px, e.y - py) < 300) {
      ctx.fillStyle = "#f33";
      ctx.beginPath();
      ctx.arc(e.x - cx - 8, e.y - cy - 10, 3, 0, 7);
      ctx.arc(e.x - cx + 8, e.y - cy - 10, 3, 0, 7);
      ctx.fill();
    }
    if (e.big) {
      ctx.fillStyle = "#300";
      ctx.fillRect(e.x - cx - 30, e.y - cy - 40, 60, 8);
      ctx.fillStyle = "#f60";
      ctx.fillRect(e.x - cx - 30, e.y - cy - 40, 60 * Math.max(0, e.hp / e.max), 8);
    } else {
      ctx.fillStyle = "#300";
      ctx.fillRect(e.x - cx - 20, e.y - cy - 28, 40, 6);
      ctx.fillStyle = "#e33";
      ctx.fillRect(e.x - cx - 20, e.y - cy - 28, 40 * Math.max(0, e.hp / e.max), 6);
    }
  });
  projs.forEach((p) => {
    if (p.lure) {
      ctx.font = "14px serif";
      ctx.fillText("\u{1F4FB}", p.x - cx, p.y - cy + 5);
    } else drawProjReal(ctx, p.x - cx, p.y - cy, p);
  });
  parts.forEach((p) => {
    ctx.font = "14px serif";
    ctx.fillText(p.t, p.x - cx, p.y - cy + 5);
  });
  drawPlayerWeapon(ctx, px - cx, py - cy, Math.atan2(fy, fx), weapon);
  ghosts.forEach((g) => {
    if (g.lv !== L.id) return;
    ctx.fillStyle = "#0f6";
    ctx.beginPath();
    ctx.arc(g.x - cx, g.y - cy, 10, 0, 7);
    ctx.fill();
    ctx.font = "14px serif";
    ctx.fillText("\u{1F9D1}\u200D\u{1F91D}\u200D\u{1F9D1}", g.x - cx, g.y - cy + 5);
  });
  drawFloats(ctx, cx, cy);
  if (inv.includes("compass")) {
    let a = Math.atan2(exit.y - py, exit.x - px);
    ctx.font = "22px serif";
    ctx.fillText("\u{1F9ED}", px - cx + Math.cos(a) * 44, py - cy + Math.sin(a) * 44 + 8);
  }
  let near = null, nd = 60;
  items.forEach((it) => {
    let d = Math.hypot(it.x - px, it.y - py);
    if (d < nd) {
      nd = d;
      near = it;
    }
  });
  if (near) {
    ctx.font = "13px monospace";
    ctx.fillStyle = "#ffe9a3";
    ctx.fillText("[E] " + ITEMS[near.id].name, px - cx, py - cy - 24);
  }
  ctx.fillStyle = "#ffdf6b55";
  ctx.fillRect(exit.x - cx - 3, exit.y - cy - 140, 6, 120);
  if (hasNV) {
    ctx.fillStyle = "rgba(0,255,80,.08)";
    ctx.fillRect(0, 0, W, H);
  }
  if (!lightOn || bat <= 0) {
    ctx.fillStyle = `rgba(0,0,10,${L.bright < 0.3 ? 0.72 : 0.45})`;
    ctx.fillRect(0, 0, W, H);
  } else {
    let flick = L.id === 3 || L.id === 6 ? Math.random() < 0.04 ? 0.55 : 0.75 : 0.75;
    let g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 320);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, `rgba(0,0,10,${flick})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    let a = Math.atan2(fy, fx);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(a);
    let cg = ctx.createLinearGradient(0, 0, 320, 0);
    cg.addColorStop(0, "rgba(255,240,180,.14)");
    cg.addColorStop(1, "rgba(255,240,180,0)");
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(320, -90);
    ctx.lineTo(320, 90);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  drawMotes(ctx, W, H, Date.now() / 1e3);
  $("vig").style.boxShadow = chasing ? "inset 0 0 160px #f00" : "inset 0 0 120px #000";
  $("warn").style.display = chasing ? "block" : "none";
  $("hpB").style.width = hp + "%";
  $("stB").style.width = st + "%";
  $("saB").style.width = sa + "%";
  if (inSafe) $("objTag").textContent = "\u{1F6DF} SAFE \u2014 healing\u2026";
  else updObj();
  mapX.fillStyle = "#000";
  mapX.fillRect(0, 0, 132, 132);
  let s = 132 / Math.max(GW, GH);
  safes.forEach((z) => {
    mapX.fillStyle = "#0f6";
    mapX.fillRect(z.x / T * s - 2, z.y / T * s - 2, 4, 4);
  });
  traders.forEach((t) => {
    mapX.fillStyle = "#0ff";
    mapX.fillRect(t.x / T * s - 2, t.y / T * s - 2, 4, 4);
  });
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (!grid[y][x]) {
    mapX.fillStyle = "#665";
    mapX.fillRect(x * s, y * s, s, s);
  }
  mapX.fillStyle = "#ff0";
  mapX.fillRect(exit.x / T * s - 2, exit.y / T * s - 2, 4, 4);
  mapX.fillStyle = "#4af";
  mapX.fillRect(px / T * s - 2, py / T * s - 2, 4, 4);
  ents.forEach((e) => {
    mapX.fillStyle = "#f00";
    mapX.fillRect(e.x / T * s - 2, e.y / T * s - 2, 4, 4);
  });
  items.forEach((it) => {
    mapX.fillStyle = "#0f0";
    mapX.fillRect(it.x / T * s - 1, it.y / T * s - 1, 2, 2);
  });
}
requestAnimationFrame(loop);

</script>
</body>
</html>
